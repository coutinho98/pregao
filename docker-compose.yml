services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pregao
      POSTGRES_PASSWORD: pregao
      POSTGRES_DB: pregao
    ports:
      - '5440:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pregao -d pregao']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
