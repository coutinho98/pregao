server {
  listen 80;
  root /usr/share/nginx/html;

  # Hashed assets never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes (/lotes/..., /auditoria/...) all load the app.
  location / {
    try_files $uri /index.html;
  }
}
